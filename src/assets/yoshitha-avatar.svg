<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Hair Highlight -->
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>

    <!-- Jacket/Medical Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Inner Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Stethoscope -->
    <linearGradient id="stethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b0764" flood-opacity="0.25"/>
    </filter>

    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes blinkAnim {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes sparkleAnim {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes pulseAura {
        0%, 100% { r: 96; opacity: 0.3; }
        50% { r: 99; opacity: 0.6; }
      }
      .character {
        animation: floatAnim 4s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .eye {
        animation: blinkAnim 4.5s ease-in-out infinite;
        transform-origin: 100px 96px;
      }
      .sparkle {
        animation: sparkleAnim 3s ease-in-out infinite;
      }
      .aura {
        animation: pulseAura 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Glowing Outer Aura -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="aura"/>
  <!-- Circular Base Background -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)"/>

  <!-- Background Decorative Sparkles -->
  <path class="sparkle" d="M30 45 L33 50 L38 52 L33 54 L30 59 L27 54 L22 52 L27 50 Z" fill="#ffffff" opacity="0.8"/>
  <path class="sparkle" style="animation-delay: 1.5s;" d="M168 55 L170 59 L174 61 L170 63 L168 67 L166 63 L162 61 L166 59 Z" fill="#fef08a" opacity="0.9"/>
  <circle class="sparkle" style="animation-delay: 0.8s;" cx="160" cy="130" r="3" fill="#ffffff" opacity="0.6"/>
  <circle class="sparkle" style="animation-delay: 2s;" cx="38" cy="120" r="2.5" fill="#fbcfe8" opacity="0.7"/>

  <g class="character" filter="url(#shadow)">
    <!-- Back Hair / Ponytail Spread -->
    <path d="M52 80 C40 100 42 140 60 160 C68 140 68 115 65 95 Z" fill="url(#hairGrad)"/>
    <path d="M148 80 C160 100 158 140 140 160 C132 140 132 115 135 95 Z" fill="url(#hairGrad)"/>

    <!-- Shoulders & Medical Coat / Jacket -->
    <path d="M42 188 C44 148 68 138 100 138 C132 138 156 148 158 188 Z" fill="url(#coatGrad)"/>
    
    <!-- Inner Cyan Shirt / Scrubs -->
    <path d="M78 142 L100 170 L122 142 C115 138 85 138 78 142 Z" fill="url(#shirtGrad)"/>

    <!-- Coat Lapels / Collar -->
    <path d="M68 140 L88 188 L100 188 L80 140 Z" fill="#f1f5f9"/>
    <path d="M132 140 L112 188 L100 188 L120 140 Z" fill="#e2e8f0"/>

    <!-- Modern Cyan Stethoscope -->
    <path d="M75 145 C75 175 125 175 125 145" fill="none" stroke="url(#stethGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="100" cy="172" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="172" r="3" fill="#38bdf8"/>

    <!-- Neck -->
    <rect x="88" y="118" width="24" height="24" rx="10" fill="url(#skinGrad)"/>
    <path d="M88 126 C94 132 106 132 112 126 Z" fill="#f59e0b" opacity="0.25"/>

    <!-- Head / Face -->
    <path d="M64 82 C64 52 136 52 136 82 C136 112 118 128 100 128 C82 128 64 112 64 82 Z" fill="url(#skinGrad)"/>

    <!-- Cute Soft Cheeks Blush -->
    <ellipse cx="76" cy="104" rx="7" ry="4" fill="#fb7185" opacity="0.45"/>
    <ellipse cx="124" cy="104" rx="7" ry="4" fill="#fb7185" opacity="0.45"/>

    <!-- Ears -->
    <circle cx="63" cy="94" r="7" fill="url(#skinGrad)"/>
    <circle cx="137" cy="94" r="7" fill="url(#skinGrad)"/>
    <!-- Cute Stud Earrings -->
    <circle cx="63" cy="96" r="2" fill="#38bdf8"/>
    <circle cx="137" cy="96" r="2" fill="#38bdf8"/>

    <!-- Eyes (Animated Blink) -->
    <g class="eye">
      <!-- Left Eye -->
      <ellipse cx="80" cy="95" rx="7.5" ry="9" fill="#1e1b4b"/>
      <ellipse cx="80" cy="95" rx="5" ry="7" fill="#4338ca"/>
      <!-- Highlights -->
      <circle cx="78" cy="91" r="3" fill="#ffffff"/>
      <circle cx="82" cy="97" r="1.5" fill="#ffffff"/>
      <!-- Eyelashes -->
      <path d="M72 88 C76 84 84 84 88 88" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M88 88 L91 85" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>

      <!-- Right Eye -->
      <ellipse cx="120" cy="95" rx="7.5" ry="9" fill="#1e1b4b"/>
      <ellipse cx="120" cy="95" rx="5" ry="7" fill="#4338ca"/>
      <!-- Highlights -->
      <circle cx="118" cy="91" r="3" fill="#ffffff"/>
      <circle cx="122" cy="97" r="1.5" fill="#ffffff"/>
      <!-- Eyelashes -->
      <path d="M112 88 C116 84 124 84 128 88" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M128 88 L131 85" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Eyebrows -->
    <path d="M73 83 C77 81 83 81 87 83" fill="none" stroke="#3b0764" stroke-width="2" stroke-linecap="round"/>
    <path d="M113 83 C117 81 123 81 127 83" fill="none" stroke="#3b0764" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Small Nose -->
    <path d="M98 100 C99 102 101 102 102 100" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Happy Smiling Mouth -->
    <path d="M93 109 C96 115 104 115 107 109" fill="none" stroke="#be123c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M95 110 Q100 115 105 110" fill="#f43f5e" opacity="0.6"/>

    <!-- Front Hair / Stylish Bangs -->
    <path d="M62 76 C62 44 138 44 138 76 C138 82 134 94 132 98 C128 85 125 76 118 72 C110 82 105 82 98 72 C92 82 86 85 82 72 C75 76 72 85 68 98 C66 94 62 82 62 76 Z" fill="url(#hairGrad)"/>
    
    <!-- Hair Shimmer Highlight Arc -->
    <path d="M72 58 C85 50 115 50 128 58" fill="none" stroke="url(#hairHighlight)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

    <!-- Cute Medical Hairpin / Heart Cross Clip -->
    <g transform="translate(126, 62)">
      <circle cx="0" cy="0" r="7" fill="#ef4444"/>
      <path d="M-3 0 L3 0 M0 -3 L0 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Clean Border Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
</svg>

